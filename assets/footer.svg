<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" viewBox="0 0 900 120" role="img" aria-label="end of transmission">
<defs>
  <pattern id="grid" width="45" height="45" patternUnits="userSpaceOnUse"><path d="M45 0H0V45" fill="none" stroke="#FFB000" stroke-opacity=".06"/></pattern>
  <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" fill-opacity=".35"/></pattern>
  <filter id="glow" x="-20%" y="-100%" width="140%" height="300%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .mono{font-family:'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .xs{font-size:11px;letter-spacing:2px}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  </style>
</defs>
<rect width="900" height="120" fill="#0a0908"/>
<rect width="900" height="120" fill="url(#grid)"/>
<line x1="40" y1="52" x2="860" y2="52" stroke="#8a5f00" stroke-opacity=".8"/>
<g transform="translate(0 52)"><g filter="url(#glow)"><g><path d="M0 0H14L19 -7L24 0H30L34 -30L38 22L42 0H56L61 -9L66 0H80" fill="none" stroke="#FFB000" stroke-width="1.8" stroke-linejoin="round"/><animateTransform attributeName="transform" type="translate" from="-90 0" to="900 0" dur="3.4s" repeatCount="indefinite"/></g></g></g>
<text x="450" y="94" text-anchor="middle" class="mono xs" fill="#6b6256">— end of transmission —</text>
<text x="34" y="94" class="mono xs" fill="#6b6256">// stay curious</text>
<text x="852" y="94" text-anchor="end" class="mono xs" fill="#FFB000">&gt;</text>
<rect x="857" y="92" width="9" height="2" fill="#FFB000" class="blink"/>
<g fill="none" stroke="#FFB000" stroke-opacity=".7" stroke-width="1.5"><path d="M14 88V106H32"/><path d="M886 88V106H868"/></g>
<rect width="900" height="120" fill="url(#scan)" opacity=".4"/>
</svg>
